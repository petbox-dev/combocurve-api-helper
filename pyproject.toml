[build-system]
requires = [
    'setuptools',
    'wheel',
]
build-backend = 'setuptools.build_meta'


[project]
name = 'combocurve-api-helper'
dynamic = ['version']
description = "A library mapped to ComboCurve's API."
authors = [
    {name = 'David S. Fulford'},
]
maintainers = [
    {name = 'David S. Fulford'},
]
readme = {file = 'README.md', content-type = 'text/markdown'}
license = {file = 'LICENSE'}
# 3.9.13, not 3.9.0: the floor that `combocurve-api-v1` (>= 0.2.5) set. 2.5.0 removes that
# dependency, so nothing now needs the patch level; it is kept so this release does not
# change the install floor.
requires-python = '>=3.9.13'
dependencies = [
    'more-itertools',
    'pydantic>=2,<3',
    # Signs the legacy (v1) service-account JWT. Required in 2.5.0, which drops `combocurve-api-v1`
    # (the package that brought it in before); an optional `legacy` extra from 3.0.0.
    'pyjwt[crypto]>=2',
    'requests',
    'typing-extensions',
    'urllib3',
]
keywords = [
    'combocurve-api-helper', 'combocurve', 'cc', 'api'
]
classifiers = [
    'Development Status :: 5 - Production/Stable',
    'Intended Audience :: Science/Research',
    'Intended Audience :: Education',
    'Intended Audience :: Developers',
    'Natural Language :: English',
    'License :: OSI Approved :: MIT License',
    'Programming Language :: Python :: 3.9',
    'Programming Language :: Python :: 3.10',
    'Programming Language :: Python :: 3.11',
    'Programming Language :: Python :: 3.12',
    'Programming Language :: Python :: 3.13',
    'Topic :: Scientific/Engineering',
    'Topic :: Scientific/Engineering :: Mathematics',
    'Topic :: Software Development :: Libraries',
    'Typing :: Typed'
]


# Optional dependencies specified in pyproject.toml should be only for end-user runtime installation behavior
# and they are not intended for build/development time for the developer. instead this is the responsibility
# of the build tool itself, or should be manually provided.
# For dev dependencies required by developers working on the project we define: [dependency-groups]

[dependency-groups]
dev = [
    "mypy>=1.7.0",
    "python-dotenv>=1.0",  # tests/conftest.py loads the gitignored .env (live-test dev ids)
    "ruff>=0.15",
    "types-requests>=2.32.0.20241016",
]


[tool.setuptools.dynamic]
version = {attr = "combocurve_api_helper.__version__"}


[tool.setuptools.packages.find]
where = ['src']


[tool.setuptools.package-data]
combocurve_api_helper = ['**/*']

# `package-data = ['**/*']` would otherwise sweep in compiled bytecode
# (`__pycache__/*.pyc`) -- stale caches that bloat the sdist/wheel and can carry
# pre-edit source content. Exclude them so builds ship only real source + data.
[tool.setuptools.exclude-package-data]
combocurve_api_helper = ['**/__pycache__/*', '**/*.pyc', '**/*.pyo']


[project.urls]
Homepage = "https://github.com/petbox-dev/combocurve-api-helper.git"
Repository = "https://github.com/petbox-dev/combocurve-api-helper.git"
Issues = "https://github.com/petbox-dev/combocurve-api-helper/issues"


[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]


[tool.ruff]
line-length = 120
# Make the formatter exclusion below hold even when a tool passes the file by name
# (pre-commit, format-on-save, `ruff format <file>`). Without this, ruff honors
# excludes only on directory walks, and one explicit-path invocation reformats the
# generated files and breaks their byte-comparison freshness tests.
force-exclude = true

[tool.ruff.format]
quote-style = 'single'
# Codegen output owned by scripts/generate_model_methods.py / generate_csv_functions.py
# and byte-compared by the freshness tests -- the FORMATTER must not touch it, or those
# tests break. Excluded here only, not from the linter: the generators emit lint-clean
# source, so `ruff check` still covers these files and any drift fails loudly instead of
# accumulating silently. If lint does flag them, fix the template, not the output.
exclude = [
    '_models_generated.py',
    '_csv_generated.py',
]

[tool.ruff.lint]
# Mirrors the previous flake8 policy: pyflakes (F) + pycodestyle (E/W) + mccabe (C90),
# minus the rules this project has always ignored. Layout rules (blank lines,
# continuation indents) are now owned by `ruff format`.
select = [
    'E',
    'W',
    'F',
    'I',
    'UP',
    'B',
    'SIM',
    'TC',
    'RUF',
    'C90',
]
# SIM108 ("use a ternary") is the one SIM rule whose benefit inverts as the line
# limit grows: at line-length 120 it argues for ternaries up to 115 characters
# chaining several calls, which read worse than the if/else they replace. It did
# not fire at 100 because those ternaries did not fit. The rest of SIM stays on.
ignore = ["SIM108"]

[tool.ruff.lint.mccabe]
max-complexity = 20


[tool.mypy]
strict = true
warn_unreachable = true
warn_no_return = true
disallow_any_unimported = true
